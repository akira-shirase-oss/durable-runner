<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="light dark" />
		<title>Durable Runner</title>
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="preload" href="%sveltekit.assets%/fonts/google-sans-flex-latin.woff2" as="font" type="font/woff2" crossorigin />
		<!--
			Before first paint: a stored Light or Dark choice (else the device's setting decides, through tokens.css),
			with the page ground, so a reload never flashes the other theme. The landing's rules (src/lib/theme.ts):
			key "theme"; the old "durable-theme" key migrates once (kept only when it differs from the device's
			scheme, as migrateStored does). durable-server's inspector_csp() allows this script by its sha256 (it
			hashes every attribute-less script element in index.html, so never write that tag's literal text in a
			comment here); styles may be inline under that CSP. The colours are tokens.css's --c-app pair.
		-->
		<style>
			html { background: #f6f7f9; color-scheme: light; }
			html[data-theme='dark'] { background: #0d0e10; color-scheme: dark; }
			@media (prefers-color-scheme: dark) { html:not([data-theme='light']) { background: #0d0e10; color-scheme: dark; } }
		</style>
		<script>
			try {
				var s = localStorage, o = s.getItem('durable-theme'), t = s.getItem('theme');
				if (o !== null) {
					s.removeItem('durable-theme');
					if (t !== 'light' && t !== 'dark' && (o === 'light' || o === 'dark') && o !== (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')) s.setItem('theme', (t = o));
				}
				if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div class="app-root">%sveltekit.body%</div>
	</body>
</html>
