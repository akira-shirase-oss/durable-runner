# The million-scale load battery on hosted runners — the ship gate's heavy
# half (laptop smokes stay local: `perf/battery.sh`). Manual only: a full run
# is ~3 h. Results land in perf/results/ with machine spec + commit and are
# uploaded as an artifact (a FAIL uploads too — misses are evidence, never
# rerun to green). The coordinator commits them through a reviewed branch;
# this workflow never pushes.
name: load

on:
  workflow_dispatch:
    inputs:
      battery:
        description: "full = the million-scale battery (~3 h); smoke = the quick local check"
        required: true
        default: "full"
        type: choice
        options: [full, smoke]

permissions:
  contents: read

concurrency:
  # Never cancel a battery halfway: a partial run is not evidence, and two
  # batteries on one runner would contaminate each other's numbers.
  group: load-${{ github.ref }}
  cancel-in-progress: false

jobs:
  battery:
    # Pinned image, not -latest: machine spec must stay comparable between runs.
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    services:
      # The workspaces scenario runs twice at million scale — memory
      # backend always, postgres against this service. Named
      # PG_DATABASE_URL (not DATABASE_URL) so no other scenario's spawned
      # server silently picks up the account store and changes what it
      # measures; battery.sh activates it only for the pg run.
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: durable_load
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d durable_load"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      BATTERY: ${{ inputs.battery }}
      RUN_ID: ${{ github.run_id }}
      PERF_HOST_LABEL: github-ubuntu-24.04
      PG_DATABASE_URL: postgres://postgres:postgres@localhost:5432/durable_load
      # Per-run results dir: the artifact uploads only this run's files,
      # never the committed laptop history in perf/results/.
      RESULTS_DIR: perf/results/${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: |
          rustup --version
          rustup toolchain install || rustup show
          cargo --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Build the release server the harness spawns
        run: cargo build --release --locked -p durable-server

      - name: Battery
        run: perf/battery.sh "--$BATTERY"

      # Upload even on a failed battery: the miss is evidence. Only this
      # run's directory goes up; ${{ }} expands where $VAR did not.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: perf-results-${{ github.run_id }}
          path: perf/results/${{ github.run_id }}/
          if-no-files-found: warn
