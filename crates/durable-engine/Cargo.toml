[package]
name = "durable-engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
async-trait = "0.1"
durable-domain = { path = "../durable-domain" }
durable-journal = { path = "../durable-journal" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
