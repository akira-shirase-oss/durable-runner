[package]
name = "durable-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
async-trait = "0.1"
durable-domain = { path = "../durable-domain" }
durable-journal = { path = "../durable-journal" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }

[dev-dependencies]
durable-journal = { path = "../durable-journal", features = ["fault-injection"] }
proptest = "1"
tempfile = "3"
# Paused/injected clock for deadline tests (test-util enables
# tokio::time::pause/advance) — test builds only.
tokio = { version = "1", features = ["test-util"] }

[lints]
workspace = true
