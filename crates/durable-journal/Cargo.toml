[package]
name = "durable-journal"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
crc32fast = "1.4"
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[features]
# Scripted write/fsync/truncate failures for tests. Never enabled in a
# release build: only dev-dependencies turn it on.
fault-injection = []

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
