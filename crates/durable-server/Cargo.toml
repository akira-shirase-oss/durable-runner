[package]
name = "durable-server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
# Only `std`: this workspace does not ask for base64's SIMD `unsafe` code
# (hyper-util, through reqwest, still turns base64's defaults on; D-048).
base64 = { version = "0.23", default-features = false, features = ["std"] }
clap = { version = "4", features = ["derive"] }
durable-accounts = { path = "../durable-accounts" }
durable-domain = { path = "../durable-domain" }
durable-engine = { path = "../durable-engine" }
durable-journal = { path = "../durable-journal" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2.6"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tower-http = { version = "0.7", features = ["fs", "timeout"] }
# Served directly (not axum::serve) for a header timeout, a connection cap
# and graceful shutdown (D-045). Both are already in the graph via axum.
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["server", "http1", "tokio"] }
tower = { version = "0.5", default-features = false, features = ["util"] }

[dev-dependencies]
durable-journal = { path = "../durable-journal", features = ["fault-injection"] }
http-body = "1"
http-body-util = "0.1"
tempfile = "3"
tokio = { version = "1", features = ["io-util"] }
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
