[package]
name = "durable-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1"
# Only `std`: this workspace does not ask for base64's SIMD `unsafe` code
# (hyper-util, through reqwest, still turns base64's defaults on; D-048).
base64 = { version = "0.23", default-features = false, features = ["std"] }
clap = { version = "4", features = ["derive"] }
durable-journal = { path = "../durable-journal" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
proptest = "1"
tempfile = "3"

[lints]
workspace = true
